name: Benchmark Cargo PRs on Zed

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  BASE_SHA: 1e02d691ba8b99d46a664ca5af7a6bd56e1e44cf
  QUEUE_SHA: 9c8691d224960d8688e19ef310686c71490cdb05
  CACHE_SHA: 1e31e24161755c0ce49441ebdc7eb71c833c1a29
  ZED_SHA: 98f39bfcca6f5c1546232916f307dc062b062f64

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout Cargo fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: cargo-src

      - name: Checkout pinned Zed
        uses: actions/checkout@v4
        with:
          repository: zed-industries/zed
          ref: ${{ env.ZED_SHA }}
          fetch-depth: 1
          path: zed

      - name: Install Rust toolchains
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          rustup toolchain install 1.95.0 --profile minimal

      - name: Create exact Cargo worktrees
        run: |
          git -C cargo-src worktree add ../cargo-base "$BASE_SHA"
          git -C cargo-src worktree add ../cargo-queue "$QUEUE_SHA"
          git -C cargo-src worktree add ../cargo-cache "$CACHE_SHA"

      - name: Build the three Cargo binaries
        run: |
          set -euxo pipefail
          for variant in base queue cache; do
            CARGO_TARGET_DIR="$RUNNER_TEMP/cargo-build-$variant" \
              cargo +1.97.0 build --release --locked \
              --manifest-path "cargo-$variant/Cargo.toml" \
              --bin cargo
            cp "$RUNNER_TEMP/cargo-build-$variant/release/cargo" "$RUNNER_TEMP/cargo-$variant"
          done

      - name: Prepare Zed dependencies and warm artifacts
        working-directory: zed
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_TARGET_DIR: ${{ runner.temp }}/zed-target
        run: |
          "$RUNNER_TEMP/cargo-base" fetch --locked
          "$RUNNER_TEMP/cargo-base" check --locked -p zed --lib

      - name: Benchmark ready queue
        working-directory: zed
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
          CARGO_TARGET_DIR: ${{ runner.temp }}/zed-target
        run: |
          python3 - <<'PY'
          import json, os, statistics, subprocess, time
          from pathlib import Path
          runner = Path(os.environ["RUNNER_TEMP"])
          results = {}
          for name, cargo in {"base_scanner": runner/"cargo-base", "binary_heap": runner/"cargo-queue"}.items():
              samples = []
              for _ in range(20):
                  start = time.perf_counter_ns()
                  subprocess.run([str(cargo), "check", "--locked", "--offline", "-p", "zed", "--lib"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
                  samples.append((time.perf_counter_ns()-start)/1e6)
              results[name] = {"samples_ms": samples, "median_ms": statistics.median(samples), "mean_ms": statistics.mean(samples), "stdev_ms": statistics.stdev(samples)}
          (runner/"queue-results.json").write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY

      - name: Benchmark shared probe cache
        working-directory: zed
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          python3 - <<'PY'
          import json, os, shutil, statistics, subprocess, time
          from pathlib import Path
          runner = Path(os.environ["RUNNER_TEMP"])
          results = {}
          for name, cargo in {"base_local_probe": runner/"cargo-base", "shared_probe_cache": runner/"cargo-cache"}.items():
              home = runner/f"cargo-home-{name}"
              home.mkdir(exist_ok=True)
              for child in ("registry", "git"):
                  source = Path.home()/".cargo"/child
                  dest = home/child
                  if source.exists() and not dest.exists(): dest.symlink_to(source, target_is_directory=True)
              samples = []
              for i in range(20):
                  target = runner/f"zed-probe-{name}-{i}"
                  shutil.rmtree(target, ignore_errors=True)
                  env = os.environ.copy(); env["CARGO_TARGET_DIR"] = str(target); env["CARGO_HOME"] = str(home); env["CARGO_NET_OFFLINE"] = "true"
                  start = time.perf_counter_ns()
                  subprocess.run([str(cargo), "check", "--locked", "-Z", "unstable-options", "--unit-graph", "-p", "zed", "--lib"], check=True, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, env=env)
                  samples.append((time.perf_counter_ns()-start)/1e6)
              results[name] = {"samples_ms": samples, "median_ms": statistics.median(samples), "mean_ms": statistics.mean(samples), "stdev_ms": statistics.stdev(samples)}
          (runner/"probe-results.json").write_text(json.dumps(results, indent=2))
          print(json.dumps(results, indent=2))
          PY

      - name: Summarize
        if: always()
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ["RUNNER_TEMP"]); lines=["# Cargo PR benchmarks on Zed",""]
          for title,file in [("Warm no-op Zed check","queue-results.json"),("Fresh build-dir Zed unit graph","probe-results.json")]:
              lines += [f"## {title}",""]
              p=root/file
              if not p.exists(): lines += ["Did not complete.",""]; continue
              data=json.loads(p.read_text()); lines += ["| Variant | Median | Mean | Stddev |","|---|---:|---:|---:|"]
              for name,v in data.items(): lines.append(f"| `{name}` | {v['median_ms']:.2f} ms | {v['mean_ms']:.2f} ms | {v['stdev_ms']:.2f} ms |")
              lines.append("")
          text="\n".join(lines); (root/"zed-benchmark-summary.md").write_text(text); print(text)
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as f: f.write(text)
          PY

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zed-cargo-pr-benchmarks
          path: |
            ${{ runner.temp }}/queue-results.json
            ${{ runner.temp }}/probe-results.json
            ${{ runner.temp }}/zed-benchmark-summary.md
          if-no-files-found: warn
