name: Single ready heap updater v2

on:
  pull_request:
    branches: [master]
    paths:
      - .github/single-ready-heap-trigger/run

permissions:
  contents: write

jobs:
  update:
    if: github.repository == 'zozo123/cargo'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout trusted updater
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: master
          path: control
          persist-credentials: false
      - name: Checkout target branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/ready-unit-heap
          path: target
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
      - name: Apply trusted update
        working-directory: target
        run: python3 ../control/.github/scripts/apply-single-ready-heap.py
      - name: Validate
        working-directory: target
        run: |
          cargo +1.97.0 fmt --all
          git diff --check
          cargo +1.97.0 test --lib util::dependency_queue
          cargo +1.97.0 test --lib compiler::job_queue
          cargo +1.97.0 clippy --lib --tests --benches -- -D warnings
      - name: Commit update
        working-directory: target
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/compiler/job_queue/mod.rs src/util/dependency_queue.rs
          git commit -m "Schedule directly from the ready heap"
          git push origin HEAD:agent/ready-unit-heap
