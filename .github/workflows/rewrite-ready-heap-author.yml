name: Rewrite ready heap commit author

on:
  pull_request:
    branches: [master]
    paths:
      - .github/rewrite-ready-heap-author/run

permissions:
  contents: write

jobs:
  rewrite:
    if: github.repository == 'zozo123/cargo'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/ready-unit-heap
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Rewrite validated commit identity
        shell: bash
        env:
          GIT_AUTHOR_NAME: zozo123
          GIT_AUTHOR_EMAIL: 553010+zozo123@users.noreply.github.com
          GIT_COMMITTER_NAME: zozo123
          GIT_COMMITTER_EMAIL: 553010+zozo123@users.noreply.github.com
        run: |
          set -euo pipefail
          git commit --amend --no-edit --author="zozo123 <553010+zozo123@users.noreply.github.com>"
          git push --force-with-lease origin HEAD:agent/ready-unit-heap
