name: Git manifest index feasibility

on:
  push:
    branches:
      - experiment/14395-index-feasibility-e2e
    paths:
      - .github/workflows/realistic-git-index-feasibility.yml
      - .github/manifest-parsing-experiment/**

permissions:
  contents: read

env:
  UPSTREAM_SHA: 9184583d2dc29ac1e23c6304f7281fd3941bb1bb
  ZED_SHA: 5e03f2d387e629237c10a4e4fed881b64abd8fea
  CARGO_TERM_COLOR: never
  RUST_BACKTRACE: 1

jobs:
  build:
    if: github.repository == 'zozo123/cargo'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/14395-index-feasibility-e2e
          fetch-depth: 1
      - run: rustup toolchain install 1.97.0 --profile minimal
      - name: Build frozen base, hardened index, and oracle
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/bin" "$RUNNER_TEMP/results"
          git init "$RUNNER_TEMP/cargo-src"
          git -C "$RUNNER_TEMP/cargo-src" remote add upstream https://github.com/rust-lang/cargo.git
          git -C "$RUNNER_TEMP/cargo-src" fetch --depth 1 upstream "$UPSTREAM_SHA"
          git -C "$RUNNER_TEMP/cargo-src" branch upstream-base FETCH_HEAD

          build_variant() {
            name="$1"
            dir="$RUNNER_TEMP/cargo-$name"
            target="$RUNNER_TEMP/target-$name"
            git -C "$RUNNER_TEMP/cargo-src" worktree add --detach "$dir" upstream-base
            case "$name" in
              base) ;;
              index)
                python3 "$GITHUB_WORKSPACE/.github/manifest-parsing-experiment/harden_realistic_index_variant.py" "$dir"
                ;;
              oracle)
                python3 "$GITHUB_WORKSPACE/.github/manifest-parsing-experiment/make_oracle_variant.py" "$dir"
                ;;
              *) exit 2 ;;
            esac
            git -C "$dir" diff --check
            git -C "$dir" diff > "$RUNNER_TEMP/results/$name.diff"
            CARGO_TARGET_DIR="$target" \
              cargo +1.97.0 build --release --locked --bin cargo --manifest-path "$dir/Cargo.toml"
            cp "$target/release/cargo" "$RUNNER_TEMP/bin/cargo-$name"
            chmod +x "$RUNNER_TEMP/bin/cargo-$name"
            "$RUNNER_TEMP/bin/cargo-$name" --version --verbose > "$RUNNER_TEMP/results/$name-version.txt"
            sha256sum "$RUNNER_TEMP/bin/cargo-$name" >> "$RUNNER_TEMP/results/binaries.sha256"
            git -C "$RUNNER_TEMP/cargo-src" worktree remove --force "$dir"
          }

          build_variant base
          build_variant index
          build_variant oracle
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/index-feasibility-variants.tgz" bin results
      - uses: actions/upload-artifact@v4
        with:
          name: index-feasibility-variants
          path: ${{ runner.temp }}/index-feasibility-variants.tgz
          retention-days: 30

  correctness:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/14395-index-feasibility-e2e
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: index-feasibility-variants
          path: ${{ runner.temp }}
      - name: Adversarial correctness and cache-safety corpus
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/index-feasibility-variants.tgz"
          rustup toolchain install 1.95.0 --profile minimal
          export RUSTUP_TOOLCHAIN=1.95.0
          mkdir -p "$RUNNER_TEMP/out"
          python3 .github/manifest-parsing-experiment/index_feasibility.py \
            "$RUNNER_TEMP/feasibility" \
            "$RUNNER_TEMP/bin/cargo-base" \
            "$RUNNER_TEMP/bin/cargo-index" \
            "$RUNNER_TEMP/out/correctness.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-feasibility-correctness
          path: ${{ runner.temp }}/out
          retention-days: 30

  synthetic:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/14395-index-feasibility-e2e
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: index-feasibility-variants
          path: ${{ runner.temp }}
      - name: Hardened synthetic N/U scaling
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/index-feasibility-variants.tgz"
          rustup toolchain install 1.95.0 --profile minimal
          mkdir -p "$RUNNER_TEMP/out"
          python3 .github/manifest-parsing-experiment/synthetic_realistic_index.py \
            "$RUNNER_TEMP/synthetic" \
            "$RUNNER_TEMP/bin/cargo-base" \
            "$RUNNER_TEMP/bin/cargo-index" \
            "$RUNNER_TEMP/bin/cargo-oracle" \
            "$RUNNER_TEMP/out/synthetic.json"
      - uses: actions/upload-artifact@v4
        with:
          name: index-feasibility-synthetic
          path: ${{ runner.temp }}/out
          retention-days: 30

  zed:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/14395-index-feasibility-e2e
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: index-feasibility-variants
          path: ${{ runner.temp }}
      - name: Prepare pinned Zed and hardened index
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$RUNNER_TEMP" -xzf "$RUNNER_TEMP/index-feasibility-variants.tgz"
          rustup toolchain install 1.95.0 --profile minimal
          git init "$RUNNER_TEMP/zed"
          git -C "$RUNNER_TEMP/zed" remote add origin https://github.com/zed-industries/zed.git
          git -C "$RUNNER_TEMP/zed" fetch --depth 1 origin "$ZED_SHA"
          git -C "$RUNNER_TEMP/zed" checkout --detach FETCH_HEAD
          export RUSTUP_TOOLCHAIN=1.95.0 CARGO_HOME="$RUNNER_TEMP/cargo-home"
          cd "$RUNNER_TEMP/zed"
          "$RUNNER_TEMP/bin/cargo-base" fetch --locked
          "$RUNNER_TEMP/bin/cargo-base" metadata --format-version 1 --locked --offline > "$RUNNER_TEMP/base-meta.json"

          find "$CARGO_HOME/git/checkouts" -name .cargo-manifest-index-experiment -delete 2>/dev/null || true
          CARGO_GIT_MANIFEST_INDEX_BUILD=1 \
            "$RUNNER_TEMP/bin/cargo-index" metadata --format-version 1 --locked --offline > "$RUNNER_TEMP/build-meta.json"

          # Populate the explicit upper-bound oracle from the same frozen base
          # metadata before any oracle timing. Without these sidecars the oracle
          # binary correctly falls back and does not measure the intended ceiling.
          python3 "$GITHUB_WORKSPACE/.github/manifest-parsing-experiment/write_oracle_from_metadata.py" \
            "$RUNNER_TEMP/base-meta.json" "$RUNNER_TEMP/oracle-stats.json"

          CARGO_GIT_MANIFEST_INDEX_USE=1 \
            "$RUNNER_TEMP/bin/cargo-index" metadata --format-version 1 --locked --offline > "$RUNNER_TEMP/index-meta.json"
          CARGO_GIT_MANIFEST_ORACLE=1 \
            "$RUNNER_TEMP/bin/cargo-oracle" metadata --format-version 1 --locked --offline > "$RUNNER_TEMP/oracle-meta.json"

          python3 - <<'PY'
          import json, os, pathlib
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          base=json.load(open(r/'base-meta.json'))
          for name in ('build','index','oracle'):
              assert json.load(open(r/f'{name}-meta.json')) == base, name
          idx=list((pathlib.Path(os.environ['CARGO_HOME'])/'git'/'checkouts').rglob('.cargo-manifest-index-experiment'))
          assert idx
          entries=[]
          for p in idx:
              lines=p.read_text().splitlines()
              assert lines and lines[0] == 'cargo-manifest-index-v2', p
              assert len(lines) >= 2 and lines[-1].startswith('cargo-manifest-index-end\t'), p
              body=lines[1:-1]
              assert int(lines[-1].split('\t',1)[1]) == len(body), p
              entries.extend(line for line in body if '\t' in line)
          stats={
              'index_files':len(idx),
              'index_entries':len(entries),
              'index_unique_names':len({x.split('\t',1)[0] for x in entries}),
              'index_bytes':sum(p.stat().st_size for p in idx),
          }
          (r/'index-stats.json').write_text(json.dumps(stats,indent=2,sort_keys=True))
          print(stats)
          PY
      - name: Warm E2E and same-binary cold-build cost
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          cp "$RUNNER_TEMP/index-stats.json" "$RUNNER_TEMP/out/index-stats.json"
          cp "$RUNNER_TEMP/oracle-stats.json" "$RUNNER_TEMP/out/oracle-stats.json"
          export RUSTUP_TOOLCHAIN=1.95.0 CARGO_HOME="$RUNNER_TEMP/cargo-home" CARGO_NET_OFFLINE=true
          export COMMAND_JSON='["metadata","--format-version","1","--locked","--offline"]'
          export VARIANTS_JSON="$(python3 - <<'PY'
          import json, os
          r=os.environ['RUNNER_TEMP']
          print(json.dumps({
            'base': {'path':f'{r}/bin/cargo-base'},
            'index': {'path':f'{r}/bin/cargo-index','env':{'CARGO_GIT_MANIFEST_INDEX_USE':'1'}},
            'oracle': {'path':f'{r}/bin/cargo-oracle','env':{'CARGO_GIT_MANIFEST_ORACLE':'1'}},
          }))
          PY
          )"
          python3 .github/manifest-parsing-experiment/measure_variants.py \
            "$RUNNER_TEMP/zed" "$RUNNER_TEMP/out/warm-${{ matrix.replica }}.json" 30

          python3 - <<'PY'
          import json, os, pathlib, random, statistics, subprocess, time
          r=pathlib.Path(os.environ['RUNNER_TEMP'])
          home=pathlib.Path(os.environ['CARGO_HOME'])
          cwd=r/'zed'; cargo=r/'bin/cargo-index'; env=os.environ.copy()
          pairs=[]; rows=[]
          rng=random.Random(14395)
          for round_no in range(24):
              order=['plain','build']
              if rng.randrange(2): order.reverse()
              values={}
              for name in order:
                  for p in (home/'git'/'checkouts').rglob('.cargo-manifest-index-experiment'):
                      p.unlink()
                  e=env.copy()
                  e.pop('CARGO_GIT_MANIFEST_INDEX_BUILD',None)
                  e.pop('CARGO_GIT_MANIFEST_INDEX_USE',None)
                  if name=='build': e['CARGO_GIT_MANIFEST_INDEX_BUILD']='1'
                  t=time.perf_counter_ns()
                  p=subprocess.run([str(cargo),'metadata','--format-version','1','--locked','--offline'],cwd=cwd,env=e,stdout=subprocess.DEVNULL,stderr=subprocess.PIPE,text=True)
                  ms=(time.perf_counter_ns()-t)/1e6
                  if p.returncode: raise SystemExit(p.stderr[-6000:])
                  values[name]=ms; rows.append({'round':round_no,'variant':name,'elapsed_ms':ms})
              pairs.append(values['build']-values['plain'])
          boots=[]
          for _ in range(10000):
              sample=[pairs[rng.randrange(len(pairs))] for _ in pairs]
              boots.append(statistics.mean(sample))
          boots.sort()
          out={
            'pairs':len(pairs), 'rows':rows,
            'paired_mean_build_minus_plain_ms':statistics.mean(pairs),
            'paired_median_build_minus_plain_ms':statistics.median(pairs),
            'paired_mean_95ci_ms':[boots[int(.025*len(boots))],boots[int(.975*len(boots))-1]],
            'build_slower_pairs':sum(x>0 for x in pairs),
          }
          (r/'out'/f'cold-${{ matrix.replica }}.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,indent=2,sort_keys=True))
          PY

          cd "$RUNNER_TEMP/zed"
          CARGO_GIT_MANIFEST_INDEX_BUILD=1 "$RUNNER_TEMP/bin/cargo-index" metadata --format-version 1 --locked --offline >/dev/null
          CARGO_GIT_MANIFEST_INDEX_USE=1 CARGO_GIT_MANIFEST_INDEX_STATS=1 \
            "$RUNNER_TEMP/bin/cargo-index" metadata --format-version 1 --locked --offline \
            >/dev/null 2> "$RUNNER_TEMP/out/query-stats-${{ matrix.replica }}.txt"
          if command -v strace >/dev/null; then
            strace -f -c "$RUNNER_TEMP/bin/cargo-base" metadata --format-version 1 --locked --offline >/dev/null 2> "$RUNNER_TEMP/out/strace-base-${{ matrix.replica }}.txt" || true
            CARGO_GIT_MANIFEST_INDEX_USE=1 strace -f -c "$RUNNER_TEMP/bin/cargo-index" metadata --format-version 1 --locked --offline >/dev/null 2> "$RUNNER_TEMP/out/strace-index-${{ matrix.replica }}.txt" || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: index-feasibility-zed-${{ matrix.replica }}
          path: ${{ runner.temp }}/out
          retention-days: 30

  aggregate:
    if: always()
    needs: [correctness, synthetic, zed]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: index-feasibility-*
          path: ${{ runner.temp }}/all
          merge-multiple: true
      - name: Build compact decision summary
        shell: bash
        run: |
          python3 - <<'PY'
          import json, pathlib, statistics
          root=pathlib.Path('${{ runner.temp }}/all')
          lines=['# cargo#14395 index feasibility', '']
          corr=root/'correctness.json'
          if corr.exists():
              d=json.load(open(corr)); lines += [f"correctness: {d.get('case_count')} / {d.get('case_count')} cases passed", '']
          warm=[]; cold=[]
          for p in sorted(root.glob('warm-*.json')):
              d=json.load(open(p)); c=d['comparisons_vs_first']
              warm.append((p.name,c['index']['paired_mean_baseline_minus_variant_ms'],c['index']['paired_mean_95ci_ms'],c['index']['wins_variant_faster'],c['oracle']['paired_mean_baseline_minus_variant_ms']))
          for p in sorted(root.glob('cold-*.json')):
              d=json.load(open(p)); cold.append((p.name,d['paired_mean_build_minus_plain_ms'],d['paired_mean_95ci_ms']))
          lines.append('## Zed warm index')
          for name,mean,ci,wins,oracle in warm:
              lines.append(f"- {name}: index saves {mean:.2f} ms, 95% CI [{ci[0]:.2f}, {ci[1]:.2f}], {wins}/30 wins; oracle {oracle:.2f} ms")
          if warm:
              lines.append(f"- mean across runner point-estimates: {statistics.mean(x[1] for x in warm):.2f} ms")
              lines.append(f"- mean oracle point-estimate: {statistics.mean(x[4] for x in warm):.2f} ms")
              lines.append(f"- fraction of oracle point-estimate: {statistics.mean(x[1] for x in warm)/statistics.mean(x[4] for x in warm)*100:.1f}%")
          lines += ['', '## Cold index publication cost (same binary)']
          for name,mean,ci in cold:
              lines.append(f"- {name}: build - plain {mean:+.2f} ms, 95% CI [{ci[0]:+.2f}, {ci[1]:+.2f}]")
          synth=root/'synthetic.json'
          if synth.exists():
              lines += ['', '## Synthetic', '```json', json.dumps(json.load(open(synth)),indent=2)[:12000], '```']
          out='\n'.join(lines)+'\n'
          pathlib.Path('${{ runner.temp }}/summary.md').write_text(out)
          print(out)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: index-feasibility-summary
          path: ${{ runner.temp }}/summary.md
          retention-days: 30
